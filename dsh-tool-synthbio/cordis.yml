name: dsh-tool-synthbio
version: 1.0.0
description: Synthetic Biology & Genetic Engineering -- CRISPR guide RNA design, metabolic pathway optimization, genetic circuit design, protein structure prediction, biosensor engineering, fermentation bioprocess optimization, DNA assembly strategy, biosafety level assessment
author: synthbio
tools:

  - name: crispr_guide_designer
    description: CRISPR guide RNA designer with on-target efficiency scoring, off-target risk prediction, PAM site identification, and multi-guide ranking for knockout, knock-in, or base editing applications
    inputSchema:
      type: object
      properties:
        target_gene:
          type: string
          description: Target gene symbol or identifier (e.g. TP53, EMX1, FANCF)
        target_sequence:
          type: string
          description: Target DNA sequence (500-2000 bp) containing the region of interest
        genome:
          type: string
          description: Reference genome (e.g. hg38, mm10, GRCh38)
        pam_requirement:
          type: string
          description: PAM motif requirement (NGG, NRG, TTTN, NNGG)
        guide_length:
          type: number
          description: Guide RNA length in nucleotides (17-23)
        max_off_targets:
          type: number
          description: Maximum allowable off-target sites
        editing_strategy:
          type: string
          description: Editing approach (knockout, knock_in, base_edit, prime_edit, CRISPRi, CRISPRa)
        seed_date:
          type: string
          description: Seed date for reproducible output (YYYY-MM-DD)
    outputSchema:
      type: object
      properties:
        design_id:
          type: string
          description: Unique design run identifier
        target_gene:
          type: string
          description: Target gene analyzed
        guides_designed:
          type: number
          description: Total number of guide RNAs designed
        top_guides:
          type: array
          description: Top-ranked guide RNAs with scores
        average_on_target_score:
          type: number
          description: Mean Doench-2016 on-target score across all guides
        off_target_risk:
          type: string
          description: Overall off-target risk classification
    examples:
      - input:
          target_gene: "EMX1"
          target_sequence: "GAGTCCGAGCAGAAGAAGAAAGGGTCGCGGATCGCTCAGCGAGCGAGCGAGCGAGCGAGCGAGCGAGCGAGCGAGCGAGCGAGCGAGCGAGCGAGCGAGCGAGC"
          genome: "hg38"
          pam_requirement: "NGG"
          guide_length: 20
          max_off_targets: 5
          editing_strategy: "knockout"
          seed_date: "2026-08-25"
        output:
          design_id: "CRSP-7A3F9C2E"
          target_gene: "EMX1"
          guides_designed: 8
          top_guides: [{ guide_id: "G1", sequence: "GAGTCCGAGCAGAAGAAGAA", pam: "NGG", on_target_score: 0.87, gc_content: 0.55, off_targets: 0 }]
          average_on_target_score: 0.72
          off_target_risk: "LOW -- zero off-targets with >= 3 mismatches for top 3 guides"

  - name: metabolic_pathway_optimizer
    description: Metabolic pathway optimization with flux balance analysis, enzyme knockout prediction, yield maximization, and cofactor balancing for microbial cell factory engineering
    inputSchema:
      type: object
      properties:
        host_organism:
          type: string
          description: Host organism (e.g. E_coli, S_cerevisiae, P_putida, B_subtilis)
        target_product:
          type: string
          description: Target metabolite or product name
        substrate:
          type: string
          description: Primary carbon substrate (e.g. glucose, glycerol, xylose, CO2)
        pathway_length:
          type: number
          description: Number of enzymatic steps in the heterologous pathway
        optimization_target:
          type: string
          description: Optimization objective (yield, titer, productivity, carbon_efficiency)
        max_knockouts:
          type: number
          description: Maximum number of gene knockouts allowed
        seed_date:
          type: string
          description: Seed date for reproducible output (YYYY-MM-DD)
    outputSchema:
      type: object
      properties:
        optimization_id:
          type: string
          description: Unique optimization run identifier
        predicted_yield_mol_mol:
          type: number
          description: Predicted molar yield (mol product / mol substrate)
        predicted_titer_g_l:
          type: number
          description: Predicted titer in g/L
        flux_variability_range:
          type: string
          description: Flux variability analysis summary
        recommended_knockouts:
          type: array
          description: Recommended gene knockouts with expected impact
        cofactor_balance:
          type: string
          description: NAD(P)H and ATP cofactor balance assessment
    examples:
      - input:
          host_organism: "E_coli"
          target_product: "1,3-propanediol"
          substrate: "glucose"
          pathway_length: 6
          optimization_target: "yield"
          max_knockouts: 4
          seed_date: "2026-08-25"
        output:
          optimization_id: "MPO-B4E21A80"
          predicted_yield_mol_mol: 0.68
          predicted_titer_g_l: 42.3
          flux_variability_range: "0.52 -- 0.71 mol/mol across confidence interval"
          recommended_knockouts: [{ gene: "ldhA", impact: "+12% yield", confidence: 0.91 }, { gene: "pta", impact: "+8% yield", confidence: 0.85 }]
          cofactor_balance: "Balanced -- NADH surplus of 0.4 mol/mol, no additional transhydrogenase needed"

  - name: genetic_circuit_designer
    description: Genetic circuit design with promoter/RBS/CDS part selection, logic gate implementation, transfer function modeling, and noise analysis for synthetic gene networks
    inputSchema:
      type: object
      properties:
        circuit_type:
          type: string
          description: Circuit architecture (genetic_switch, oscillator, logic_gate, biosensor, pulse_generator, band_pass_filter)
        host_organism:
          type: string
          description: Host organism for circuit deployment
        input_signals:
          type: array
          description: List of input signal molecules or conditions
        output_type:
          type: string
          description: Desired output (GFP, enzyme, therapeutic_protein, reporter)
        optimization_target:
          type: string
          description: Design objective (yield, specificity, response_time, robustness, low_noise)
        dynamic_range_fold:
          type: number
          description: Minimum required fold-change between ON and OFF states
        seed_date:
          type: string
          description: Seed date for reproducible output (YYYY-MM-DD)
    outputSchema:
      type: object
      properties:
        circuit_id:
          type: string
          description: Unique circuit design identifier
        circuit_type:
          type: string
          description: Circuit architecture type
        parts_count:
          type: number
          description: Total number of genetic parts in the circuit
        predicted_fold_change:
          type: number
          description: Predicted ON/OFF fold-change
        response_time_min:
          type: number
          description: Predicted response time in minutes
        noise_level:
          type: string
          description: Intrinsic noise assessment (CV percentage)
    examples:
      - input:
          circuit_type: "genetic_switch"
          host_organism: "E_coli"
          input_signals: ["aTc", "IPTG"]
          output_type: "GFP"
          optimization_target: "specificity"
          dynamic_range_fold: 100
          seed_date: "2026-08-25"
        output:
          circuit_id: "GCD-91C3A772"
          circuit_type: "genetic_switch"
          parts_count: 6
          predicted_fold_change: 245
          response_time_min: 35
          noise_level: "LOW -- CV 8.2% across simulated population"

  - name: protein_structure_predictor
    description: Protein structure prediction with secondary/tertiary structure modeling, domain identification, disorder region prediction, pLDDT confidence scoring, and ligand-binding pocket detection
    inputSchema:
      type: object
      properties:
        sequence:
          type: string
          description: Amino acid sequence (FASTA format, 50-2000 residues)
        prediction_method:
          type: string
          description: Structure prediction method (alphafold3, esmfold, rosettafold, comparative_modeling)
        include_domains:
          type: boolean
          description: Whether to predict functional domains
        include_disorder:
          type: boolean
          description: Whether to predict intrinsically disordered regions
        include_binding_pockets:
          type: boolean
          description: Whether to predict ligand-binding pockets
        seed_date:
          type: string
          description: Seed date for reproducible output (YYYY-MM-DD)
    outputSchema:
      type: object
      properties:
        prediction_id:
          type: string
          description: Unique prediction run identifier
        sequence_length:
          type: number
          description: Number of amino acid residues
        molecular_weight_kda:
          type: number
          description: Predicted molecular weight in kilodaltons
        plddt_avg:
          type: number
          description: Average pLDDT confidence score (0-100)
        secondary_structure:
          type: object
          description: Helix/sheet/coil percentages
        binding_pockets:
          type: array
          description: Predicted ligand-binding pockets
    examples:
      - input:
          sequence: "MTEYKLVVVGAGGVGKSALTIQLIQNHFVDEYDPTIEDSYRKQVVIDGETCLLDILDTAGQEEYSAMRDQYMRTGEGFLCVFAINNTKSFEDIHHYREQIKRVKDSDDVPMVLVGNKCDLPSRTVDTKQAQDLARSYGIPFIETSAKTRQGVDDAFYTLVREIRKHKEK"
          prediction_method: "alphafold3"
          include_domains: true
          include_disorder: true
          include_binding_pockets: true
          seed_date: "2026-08-25"
        output:
          prediction_id: "PSP-20A91F4C"
          sequence_length: 169
          molecular_weight_kda: 19.8
          plddt_avg: 87.3
          secondary_structure: { helix_pct: 42.6, sheet_pct: 18.3, coil_pct: 39.1 }
          binding_pockets: [{ pocket_id: "P1", residues: "Gly12, Gly13, Val14", druggability: 0.82, confidence: 0.91 }]

  - name: biosensor_engineer
    description: Biosensor engineering with transcription factor selection, promoter tuning, sensitivity/specificity optimization, dynamic range calibration, and host-chassis compatibility assessment
    inputSchema:
      type: object
      properties:
        target_analate:
          type: string
          description: Target molecule or analyte to detect
        detection_range_um:
          type: string
          description: Required detection range in micromolar (e.g. 0.1-100)
        host_organism:
          type: string
          description: Host organism for biosensor deployment
        output_mode:
          type: string
          description: Output readout (fluorescence, colorimetric, electrochemical, luciferase)
        specificity_requirement:
          type: string
          description: Specificity level (high, medium, low)
        seed_date:
          type: string
          description: Seed date for reproducible output (YYYY-MM-DD)
    outputSchema:
      type: object
      properties:
        biosensor_id:
          type: string
          description: Unique biosensor design identifier
        tf_candidate:
          type: string
          description: Selected transcription factor candidate
        predicted_ec50_um:
          type: number
          description: Predicted half-maximal effective concentration in micromolar
        dynamic_range_fold:
          type: number
          description: Predicted fold-change between fully induced and uninduced states
        cross_reactivity_risk:
          type: string
          description: Risk of cross-reactivity with structurally similar compounds
    examples:
      - input:
          target_analate: "arsenate"
          detection_range_um: "1-500"
          host_organism: "E_coli"
          output_mode: "fluorescence"
          specificity_requirement: "high"
          seed_date: "2026-08-25"
        output:
          biosensor_id: "BSE-552E01B9"
          tf_candidate: "ArsR (E. coli native)"
          predicted_ec50_um: 12.4
          dynamic_range_fold: 85
          cross_reactivity_risk: "LOW -- < 5% cross-reactivity with phosphate at 10x concentration"

  - name: fermentation_optimizer
    description: Fermentation bioprocess optimization with media design, feeding strategy, dissolved oxygen/pH control, scale-up parameter prediction, and productivity/yield trade-off analysis
    inputSchema:
      type: object
      properties:
        organism:
          type: string
          description: Production organism strain
        product:
          type: string
          description: Target product (antibiotic, enzyme, organic_acid, amino_acid, biofuel, protein)
        fermentation_mode:
          type: string
          description: Fermentation mode (batch, fed_batch, continuous, perfusion)
        working_volume_l:
          type: number
          description: Working volume in liters
        target_titer_g_l:
          type: number
          description: Target titer in g/L
        seed_date:
          type: string
          description: Seed date for reproducible output (YYYY-MM-DD)
    outputSchema:
      type: object
      properties:
        process_id:
          type: string
          description: Unique process optimization identifier
        predicted_titer_g_l:
          type: number
          description: Predicted final titer in g/L
        predicted_productivity_g_l_h:
          type: number
          description: Predicted volumetric productivity in g/L/h
        fermentation_duration_h:
          type: number
          description: Predicted total fermentation duration in hours
        max_od600:
          type: number
          description: Predicted maximum OD600 biomass
        oxygen_demand:
          type: string
          description: Oxygen transfer rate assessment
    examples:
      - input:
          organism: "P_chrysogenum"
          product: "penicillin_G"
          fermentation_mode: "fed_batch"
          working_volume_l: 50000
          target_titer_g_l: 60
          seed_date: "2026-08-25"
        output:
          process_id: "FMT-3E91D208"
          predicted_titer_g_l: 58.7
          predicted_productivity_g_l_h: 0.42
          fermentation_duration_h: 380
          max_od600: 45.2
          oxygen_demand: "HIGH -- kLa >= 250 h-1 required, consider pure O2 sparging at scale"

  - name: dna_assembly_planner
    description: DNA assembly strategy planner with part compatibility checking, cloning vector selection, assembly method recommendation (Gibson, Golden Gate, MoClo, Gateway), and protocol step generation
    inputSchema:
      type: object
      properties:
        parts:
          type: array
          description: Array of DNA parts to assemble { name, sequence, part_type (promoter, rbs, cds, terminator, origin, marker) }
        assembly_method:
          type: string
          description: Preferred assembly method (gibson, golden_gate, gateway, moClo, bio_bricks, yeast_HR, restriction_ligation)
        vector_backbone:
          type: string
          description: Destination vector backbone name
        host_organism:
          type: string
          description: Host organism for propagation
        max_assembly_steps:
          type: number
          description: Maximum number of hierarchical assembly levels
        seed_date:
          type: string
          description: Seed date for reproducible output (YYYY-MM-DD)
    outputSchema:
      type: object
      properties:
        assembly_id:
          type: string
          description: Unique assembly plan identifier
        method_recommended:
          type: string
          description: Recommended assembly method
        parts_count:
          type: number
          description: Total number of parts to assemble
        hierarchical_levels:
          type: number
          description: Number of hierarchical assembly levels required
        estimated_success_rate:
          type: number
          description: Predicted assembly success rate (0-1)
        total_cloning_time_days:
          type: number
          description: Estimated total cloning time in days
    examples:
      - input:
          parts: [{ name: "J23100", sequence: "TTGACGGCTAGCTCAGTCCTAGGTACAGTGCTAGC", part_type: "promoter" }, { name: "B0034", sequence: "AAAGAGGAGAAA", part_type: "rbs" }, { name: "GFP", sequence: "", part_type: "cds" }, { name: "B0015", sequence: "TGCCTGCTATTCCAGAAGTAGTGAGGAGGCTTTTTTGGAGGCCTAGGCCGACCGATG", part_type: "terminator" }]
          assembly_method: "gibson"
          vector_backbone: "pSB1C3"
          host_organism: "E_coli_DH5a"
          max_assembly_steps: 2
          seed_date: "2026-08-25"
        output:
          assembly_id: "DAP-88421A3F"
          method_recommended: "Gibson Assembly"
          parts_count: 4
          hierarchical_levels: 1
          estimated_success_rate: 0.92
          total_cloning_time_days: 3

  - name: biosafety_assessor
    description: Biosafety level assessment with risk group classification, containment requirement determination, dual-use research of concern (DURC) screening, and regulatory compliance pathway for genetically modified organisms
    inputSchema:
      type: object
      properties:
        organism:
          type: string
          description: Wild-type organism species
        genetic_modifications:
          type: array
          description: List of genetic modifications { type (knockout, insertion, overexpression, pathway), gene, source_organism? }
        intended_use:
          type: string
          description: Intended application (research, industrial, therapeutic, environmental_release, food_feed)
        scale:
          type: string
          description: Operation scale (lab, pilot, production)
        host_risk_group:
          type: string
          description: Host organism risk group (RG1, RG2, RG3, RG4)
        seed_date:
          type: string
          description: Seed date for reproducible output (YYYY-MM-DD)
    outputSchema:
      type: object
      properties:
        assessment_id:
          type: string
          description: Unique biosafety assessment identifier
        recommended_bsl:
          type: string
          description: Recommended biosafety level (BSL-1 through BSL-4)
        risk_group:
          type: string
          description: Organism risk group classification
        containment_requirements:
          type: array
          description: Required containment measures
        durc_flag:
          type: string
          description: Dual-use research of concern flag
        regulatory_pathway:
          type: string
          description: Applicable regulatory approval pathway
    examples:
      - input:
          organism: "E_coli_K12"
          genetic_modifications: [{ type: "insertion", gene: "crtEBI", source_organism: "P_ananatis" }, { type: "knockout", gene: "dxr" }]
          intended_use: "industrial"
          scale: "pilot"
          host_risk_group: "RG1"
          seed_date: "2026-08-25"
        output:
          assessment_id: "BSA-7F20A144"
          recommended_bsl: "BSL-1"
          risk_group: "RG1 -- non-pathogenic, well-characterized chassis"
          containment_requirements: ["Standard microbiological practices", "Decontamination of waste via autoclave", "Physical containment: Class II biosafety cabinet for open operations"]
          durc_flag: "NOT APPLICABLE -- no toxin genes, no enhanced pathogenicity, no transmissibility enhancement"
          regulatory_pathway: "EPA TSCA Section 5 (Microbial Commercial Activity Notice) for environmental release; FDA GRAS for food/feed"
