name: dsh-tool-dronedelivery
version: 1.0.0
description: Drone Delivery & Urban Air Mobility -- route optimization, cargo manifest management, UTM coordination, vertiport planning, battery swap scheduling, airspace deconfliction, weather impact assessment, BVLOS regulatory compliance
author: dronedelivery
tools:

  - name: drone_route_planner
    description: Multi-objective drone route optimization with terrain-aware pathfinding, no-fly zone avoidance, BVLOS corridor selection, and energy-minimal trajectory computation
    inputSchema:
      type: object
      properties:
        drone_model:
          type: string
          description: Drone model identifier (e.g. DJI_M30, Wingcopter_198, Zipline_Zip)
        origin:
          type: object
          description: Origin waypoint { lat, lng, name? }
        destination:
          type: object
          description: Destination waypoint { lat, lng, name? }
        waypoints:
          type: array
          description: Optional intermediate waypoints
        altitude_m:
          type: number
          description: Planned cruise altitude in meters AGL
        payload_kg:
          type: number
          description: Total payload weight in kg
        terrain_type:
          type: string
          description: Terrain classification (urban|suburban|rural|mountainous|coastal)
        avoid_populated:
          type: boolean
          description: Whether to route around densely populated areas
        seed_date:
          type: string
          description: Seed date for reproducible output (YYYY-MM-DD)
    outputSchema:
      type: object
      properties:
        route_id:
          type: string
          description: Unique route identifier
        total_distance_km:
          type: number
          description: Total route distance in kilometers
        estimated_time_min:
          type: number
          description: Estimated flight time in minutes
        energy_estimate_percent:
          type: number
          description: Battery consumption estimate as percentage
        risk_level:
          type: string
          description: Overall route risk classification
        no_fly_zone_clearance:
          type: string
          description: Status of no-fly zone clearance checks
    examples:
      - input:
          drone_model: "Wingcopter_198"
          origin: { lat: 37.7749, lng: -122.4194, name: "San Francisco Hub" }
          destination: { lat: 37.8044, lng: -122.2712, name: "Oakland Medical Center" }
          altitude_m: 120
          payload_kg: 4.5
          terrain_type: "urban"
          avoid_populated: true
          seed_date: "2026-08-25"
        output:
          route_id: "RTE-3A7F9C2E"
          total_distance_km: 18.73
          estimated_time_min: 14.2
          energy_estimate_percent: 42.8
          risk_level: "moderate"
          no_fly_zone_clearance: "CLEARED -- 3 NFZs avoided, 1 temporary restriction noted"

  - name: cargo_manifest_optimizer
    description: Drone cargo manifest optimization with weight-and-balance analysis, volumetric efficiency scoring, priority-based loading, and CG safety envelope validation
    inputSchema:
      type: object
      properties:
        drone_model:
          type: string
          description: Drone model identifier
        packages:
          type: array
          description: Array of packages { id, weight_kg, length_cm, width_cm, height_cm, fragile?, priority? }
        cg_tolerance_cm:
          type: number
          description: Maximum allowable center-of-gravity offset in cm
        wind_condition:
          type: string
          description: Wind condition for derating (calm|moderate|strong)
        seed_date:
          type: string
          description: Seed date for reproducible output
    outputSchema:
      type: object
      properties:
        manifest_id:
          type: string
          description: Unique manifest identifier
        total_weight_kg:
          type: number
          description: Total loaded weight in kg
        cg_offset_cm:
          type: number
          description: Resultant CG offset from center in cm
        volumetric_efficiency_pct:
          type: number
          description: Payload bay volume utilization percentage
        go_status:
          type: string
          description: GO / NO-GO loading decision
    examples:
      - input:
          drone_model: "Wingcopter_198"
          packages: [{ id: "PKG-001", weight_kg: 1.2, length_cm: 30, width_cm: 20, height_cm: 15, fragile: true, priority: "high" }, { id: "PKG-002", weight_kg: 2.5, length_cm: 40, width_cm: 30, height_cm: 20, priority: "medium" }]
          cg_tolerance_cm: 5.0
          wind_condition: "moderate"
          seed_date: "2026-08-25"
        output:
          manifest_id: "MNF-B4E21A80"
          total_weight_kg: 3.7
          cg_offset_cm: 2.31
          volumetric_efficiency_pct: 78.4
          go_status: "GO -- within CG envelope, payload 61.7% of max"

  - name: utm_coordinator
    description: UTM (Unmanned Traffic Management) coordination with flight plan submission, strategic deconfliction, conformance monitoring, and remote ID broadcast compliance
    inputSchema:
      type: object
      properties:
        drone_model:
          type: string
          description: Drone model identifier
        operation_area:
          type: object
          description: Operation area { center_lat, center_lng, radius_km }
        altitude_m:
          type: number
          description: Planned flight altitude in meters
        flight_type:
          type: string
          description: Flight type (VLOS|BVLOS|autonomous)
        start_time:
          type: string
          description: ISO start time of the operation
        duration_min:
          type: number
          description: Planned mission duration in minutes
        utm_provider:
          type: string
          description: UTM service provider name
        seed_date:
          type: string
          description: Seed date for reproducible output
    outputSchema:
      type: object
      properties:
        flight_plan_id:
          type: string
          description: UTM-assigned flight plan identifier
        utm_status:
          type: string
          description: UTM submission status
        deconfliction_result:
          type: string
          description: Strategic deconfliction outcome
        conformance_monitoring:
          type: string
          description: Conformance monitoring status
        remote_id_compliance:
          type: string
          description: Remote ID broadcast compliance status
    examples:
      - input:
          drone_model: "Zipline_Zip"
          operation_area: { center_lat: -1.2921, center_lng: 36.8219, radius_km: 12 }
          altitude_m: 150
          flight_type: "BVLOS"
          start_time: "2026-08-25T09:00:00Z"
          duration_min: 45
          utm_provider: "AirMap"
          seed_date: "2026-08-25"
        output:
          flight_plan_id: "UTM-FP-88421"
          utm_status: "ACCEPTED"
          deconfliction_result: "CLEAR -- no conflicting traffic detected in volume"
          conformance_monitoring: "ACTIVE -- real-time telemetry streaming at 1 Hz"
          remote_id_compliance: "COMPLIANT -- ASTM F3411-22, broadcasting on 2.4 GHz Wi-Fi beacon"

  - name: vertiport_planner
    description: Vertiport and drone-port site planning with demand modeling, throughput analysis, noise contour mapping, infrastructure sizing, and phased deployment scheduling
    inputSchema:
      type: object
      properties:
        area_bounds:
          type: object
          description: Geographic bounds { north_lat, south_lat, east_lng, west_lng }
        population_served:
          type: number
          description: Population within service area
        avg_daily_deliveries:
          type: number
          description: Projected average daily delivery volume
        terrain_type:
          type: string
          description: Terrain classification (urban|suburban|rural|mixed)
        max_stations:
          type: number
          description: Maximum number of vertiport stations to plan
        budget_constraint:
          type: string
          description: Budget tier (low|medium|high)
        seed_date:
          type: string
          description: Seed date for reproducible output
    outputSchema:
      type: object
      properties:
        plan_id:
          type: string
          description: Unique vertiport plan identifier
        recommended_stations:
          type: number
          description: Recommended number of vertiport stations
        estimated_throughput:
          type: string
          description: Daily throughput capacity estimate
        noise_impact_zone_db:
          type: string
          description: Noise impact zone description
        infrastructure_cost_usd:
          type: string
          description: Estimated infrastructure cost range
    examples:
      - input:
          area_bounds: { north_lat: 40.85, south_lat: 40.65, east_lng: -73.85, west_lng: -74.05 }
          population_served: 850000
          avg_daily_deliveries: 3200
          terrain_type: "urban"
          max_stations: 12
          budget_constraint: "medium"
          seed_date: "2026-08-25"
        output:
          plan_id: "VPT-E91C3A77"
          recommended_stations: 8
          estimated_throughput: "3,800 deliveries/day peak capacity"
          noise_impact_zone_db: "62 dBA contour within 85 m of vertiport, WHO night limit respected"
          infrastructure_cost_usd: "$4.2M -- $6.8M phased over 18 months"

  - name: battery_swap_scheduler
    description: Battery swap scheduling with predictive state-of-charge modeling, swap station logistics, charge strategy optimization, and fleet energy availability forecasting
    inputSchema:
      type: object
      properties:
        drone_model:
          type: string
          description: Drone model identifier
        fleet_size:
          type: number
          description: Number of drones in the fleet
        missions_per_day:
          type: number
          description: Average missions per drone per day
        avg_flight_min:
          type: number
          description: Average flight duration per mission in minutes
        swap_stations:
          type: array
          description: Swap station list { name, lat, lng, batteries_available, charge_time_min }
        charge_strategy:
          type: string
          description: Charge strategy (fast|slow|opportunistic)
        seed_date:
          type: string
          description: Seed date for reproducible output
    outputSchema:
      type: object
      properties:
        schedule_id:
          type: string
          description: Unique schedule identifier
        total_swaps_required:
          type: number
          description: Total battery swaps needed per day
        avg_wait_time_min:
          type: number
          description: Average drone wait time at swap stations in minutes
        fleet_energy_availability_pct:
          type: number
          description: Fleet energy availability as percentage
        battery_utilization_pct:
          type: number
          description: Battery pool utilization percentage
    examples:
      - input:
          drone_model: "DJI_M30"
          fleet_size: 24
          missions_per_day: 8
          avg_flight_min: 22
          swap_stations: [{ name: "Hub-A", lat: 37.7749, lng: -122.4194, batteries_available: 16, charge_time_min: 45 }, { name: "Hub-B", lat: 37.8044, lng: -122.2712, batteries_available: 12, charge_time_min: 45 }]
          charge_strategy: "opportunistic"
          seed_date: "2026-08-25"
        output:
          schedule_id: "BAT-7F20A144"
          total_swaps_required: 156
          avg_wait_time_min: 3.8
          fleet_energy_availability_pct: 94.2
          battery_utilization_pct: 87.6

  - name: airspace_deconfliction
    description: Tactical airspace deconfliction with trajectory prediction, separation assurance, conflict probe analysis, and resolution advisory generation for mixed-equipage UAM corridors
    inputSchema:
      type: object
      properties:
        drone_model:
          type: string
          description: Ownship drone model identifier
        ownship_trajectory:
          type: array
          description: Ownship planned waypoints array { lat, lng, altitude_m, timestamp? }
        intruder_trajectories:
          type: array
          description: Detected intruder trajectories array
        separation_standard_km:
          type: number
          description: Required horizontal separation standard in km
        lookahead_time_s:
          type: number
          description: Conflict probe lookahead time in seconds
        seed_date:
          type: string
          description: Seed date for reproducible output
    outputSchema:
      type: object
      properties:
        deconfliction_id:
          type: string
          description: Unique deconfliction run identifier
        conflicts_detected:
          type: number
          description: Number of conflicts detected in the lookahead window
        min_separation_km:
          type: number
          description: Minimum horizontal separation observed in km
        required_action:
          type: string
          description: Required resolution advisory for ownship
        resolution_options:
          type: array
          description: Available conflict resolution maneuvers
    examples:
      - input:
          drone_model: "Wingcopter_198"
          ownship_trajectory: [{ lat: 37.7749, lng: -122.4194, altitude_m: 120 }, { lat: 37.7849, lng: -122.4094, altitude_m: 120 }]
          intruder_trajectories: [[{ lat: 37.7755, lng: -122.4180, altitude_m: 130 }, { lat: 37.7855, lng: -122.4080, altitude_m: 130 }]]
          separation_standard_km: 0.5
          lookahead_time_s: 120
          seed_date: "2026-08-25"
        output:
          deconfliction_id: "DEC-552E01B9"
          conflicts_detected: 1
          min_separation_km: 0.32
          required_action: "CLIMB 30 m to 150 m AGL to achieve vertical separation"
          resolution_options: ["CLIMB to 150 m AGL", "REDUCE SPEED 15% for 20 s", "DETOUR via waypoint offset 0.3 km north"]

  - name: weather_impact_drone
    description: Weather impact assessment for drone operations with microburst/icing/shear detection, turbulence analysis, go/no-go decision matrix, and mission-specific weather thresholds
    inputSchema:
      type: object
      properties:
        drone_model:
          type: string
          description: Drone model identifier
        temperature_c:
          type: number
          description: Ambient temperature in Celsius
        wind_speed_kmh:
          type: number
          description: Sustained wind speed in km/h
        wind_gust_kmh:
          type: number
          description: Wind gust speed in km/h
        wind_direction_deg:
          type: number
          description: Wind direction in degrees
        precipitation_mm_h:
          type: number
          description: Precipitation rate in mm/h
        visibility_km:
          type: number
          description: Visibility in kilometers
        humidity_percent:
          type: number
          description: Relative humidity percentage
        cloud_ceiling_m:
          type: number
          description: Cloud ceiling height in meters
        icing_risk:
          type: boolean
          description: Icing risk detected
        location:
          type: string
          description: Operation location name
        seed_date:
          type: string
          description: Seed date for reproducible output
    outputSchema:
      type: object
      properties:
        assessment_id:
          type: string
          description: Unique weather assessment identifier
        go_no_go:
          type: string
          description: GO / NO-GO / CONDITIONAL decision
        wind_derate_pct:
          type: number
          description: Performance derating percentage due to wind
        max_operational_gust_kmh:
          type: number
          description: Maximum allowable gust speed for this drone
        critical_weather_factor:
          type: string
          description: Governing weather factor for the decision
    examples:
      - input:
          drone_model: "Wingcopter_198"
          temperature_c: 18
          wind_speed_kmh: 28
          wind_gust_kmh: 42
          wind_direction_deg: 270
          precipitation_mm_h: 0.5
          visibility_km: 8
          humidity_percent: 72
          cloud_ceiling_m: 800
          icing_risk: false
          location: "San Francisco Bay Area"
          seed_date: "2026-08-25"
        output:
          assessment_id: "WTH-3E91D208"
          go_no_go: "CONDITIONAL -- gust exceedance, monitor every 10 min"
          wind_derate_pct: 12.5
          max_operational_gust_kmh: 50
          critical_weather_factor: "Gust spread 14 km/h above sustained, rotor stress elevated"

  - name: bvlos_compliance_checker
    description: Beyond-Visual-Line-of-Sight regulatory compliance checking with SORA-based risk assessment, SAIL level determination, strategic mitigation verification, and operational authorization pathway planning
    inputSchema:
      type: object
      properties:
        drone_model:
          type: string
          description: Drone model identifier
        operation_type:
          type: string
          description: Type of BVLOS operation (linear_infrastructure|area_survey|delivery|emergency_response|cargo_transport)
        distance_km:
          type: number
          description: Maximum distance from remote pilot in km
        altitude_m:
          type: number
          description: Operating altitude in meters AGL
        population_density:
          type: string
          description: Population density classification (sparsely_populated|populated|dense_urban)
        ground_risk_class:
          type: string
          description: SORA ground risk class (I|II|III|IV|V)
        detect_and_avoid:
          type: boolean
          description: Detect-and-avoid capability present
        c2_link_redundancy:
          type: string
          description: Command-and-control link redundancy (single|dual|triple)
        emergency_recovery:
          type: string
          description: Emergency recovery method (parachute|auto_rtl|hybrid)
        seed_date:
          type: string
          description: Seed date for reproducible output
    outputSchema:
      type: object
      properties:
        compliance_id:
          type: string
          description: Unique compliance assessment identifier
        sail_level:
          type: string
          description: SAIL level determination (I-VI)
        strategic_mitigations_required:
          type: number
          description: Number of strategic mitigations required
        operational_authority_path:
          type: string
          description: Operational authority pathway (PDRA|SORA|std_conditions)
        overall_compliance:
          type: string
          description: Overall compliance status
    examples:
      - input:
          drone_model: "Wingcopter_198"
          operation_type: "delivery"
          distance_km: 25
          altitude_m: 120
          population_density: "populated"
          ground_risk_class: "III"
          detect_and_avoid: true
          c2_link_redundancy: "dual"
          emergency_recovery: "hybrid"
          seed_date: "2026-08-25"
        output:
          compliance_id: "BVC-20A91F4C"
          sail_level: "III"
          strategic_mitigations_required: 4
          operational_authority_path: "SORA with 4 strategic mitigations, PDRA-G02 applicable"
          overall_compliance: "COMPLIANT -- all critical mitigations satisfied, authorization recommended"
