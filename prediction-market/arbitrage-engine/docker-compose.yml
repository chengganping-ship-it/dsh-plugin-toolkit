version: '3.8'

services:
  arbitrage-engine:
    build: .
    containerName: prediction-arb-engine
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    environment:
      - TZ=UTC
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Grafana for advanced monitoring
  grafana:
    image: grafana/grafana:latest
    containerName: arb-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - arbitrage-engine

volumes:
  grafana-data:
