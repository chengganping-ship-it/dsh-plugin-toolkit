<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Funding Mirror v2 — 套利监控平台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #080c14; color: #e0e6ed; min-height: 100vh; }
    .header { background: linear-gradient(135deg, #141923 0%, #0d1321 100%); border-bottom: 1px solid #2a3441; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
    .header h1 { font-size: 18px; font-weight: 700; color: #00d4aa; letter-spacing: -0.3px; }
    .stats { display: flex; gap: 16px; font-size: 12px; color: #6b7a8d; }
    .stats .val { color: #e0e6ed; font-weight: 600; }
    .stats .lb { color: #00d4aa; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #00d4aa; display: inline-block; margin-right: 4px; animation: pulse 2s infinite; }
    .status-dot.off { background: #ff4444; animation: none; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
    .container { padding: 16px 24px; max-width: 1800px; margin: 0 auto; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
    .grid-2 { grid-template-columns: repeat(2, 1fr); }
    .grid-full { grid-column: 1 / -1; }
    .card { background: #141923; border: 1px solid #1e2633; border-radius: 10px; padding: 14px; }
    .card h2 { font-size: 11px; font-weight: 600; color: #6b7a8d; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
    .heatmap { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 5px; }
    .hc { padding: 6px; border-radius: 5px; text-align: center; cursor: pointer; transition: transform 0.1s; }
    .hc:hover { transform: scale(1.06); }
    .hc .s { font-size: 10px; font-weight: 600; }
    .hc .v { font-size: 12px; font-weight: 700; }
    .hc .x { font-size: 8px; opacity: 0.6; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th { text-align: left; padding: 6px; color: #6b7a8d; font-weight: 500; border-bottom: 1px solid #1e2633; font-size: 11px; }
    td { padding: 6px; border-bottom: 1px solid #141c28; }
    tr:hover { background: #141c28; }
    .bd { padding: 2px 5px; border-radius: 3px; font-size: 10px; font-weight: 600; }
    .bg { background: #00d4aa18; color: #00d4aa; }
    .by { background: #f5a62318; color: #f5a623; }
    .br { background: #ff444418; color: #ff4444; }
    .bb { background: #4a9eff18; color: #4a9eff; }
    .bp { background: #9b59b618; color: #9b59b6; }
    .em { padding: 8px; border-left: 3pxpx solid; margin-bottom: 6px; background: #141c28; border-radius: 0 5px 5px 0; }
    .em.sp { border-color: #ff4444; }
    .em.cr { border-color: #f5a623; }
    .em.dv { border-color: #4a9eff; }
    .em.rg { border-color: #9b59b6; }
    .em .d { font-size: 12px; margin-bottom: 2px; }
    .em .m { font-size: 10px; color: #6b7a8d; }
    .pi { display: flex; align-items: center; gap: 8px; padding: 6px; border-bottom: 1px solid #141c28; }
    .pi .di { font-size: 16px; }
    .pi .inf { flex: 1; }
    .pi .sy { font-weight: 600; font-size: 12px; }
    .pi .dt { font-size: 10px; color: #6b7a8d; }
    .pi .cf { font-size: 11px; font-weight: 600; }
    .empty { text-align: center; padding: 30px; color: #3d4a5c; font-size: 12px; }
    .fb { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
    .fb select, .fb input { background: #141c28; border: 1px solid #1e2633; color: #e0e6ed; padding: 5px 8px; border-radius: 5px; font-size: 11px; }
    .fb button { background: #00d4aa; color: #080c14; border: none; padding: 5px 12px; border-radius: 5px; font-weight: 600; font-size: 11px; cursor: pointer; }
    .fb button:hover { background: #00e4b8; }
    .bt-result { background: #141c28; border-radius: 8px; padding: 12px; margin-top: 10px; }
    .bt-result .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
    .bt-result .metric { text-align: center; }
    .bt-result .metric .v { font-size: 16px; font-weight: 70; font-weight: 700; }
    .bt-result .metric .l { font-size: 10px; color: #6b7a8d; }
    canvas { width: 100%; height: 120px; }
    .pnl-pos { color: #00d4aa; }
    .pnl-neg { color: #ff4444; }
    .tag { display: inline-block; padding: 1px 4px; border-radius: 3px; font-size: 9px; margin-left: 4px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Funding Mirror v2</h1>
    <div class="stats">
      <div><span class="status-dot" id="dot"></span><span id="st">连接中</span></div>
      <div>交易所: <span class="val" id="exC">-</span></div>
      <div>费率: <span class="val" id="rC">-</span></div>
      <div>机会: <span class="val lb" id="oC">-</span></div>
      <div>异常: <span class="val" id="aC">-</span></div>
      <div>跨品种: <span class="val" id="cC">-</span></div>
      <div>DB: <span class="val" id="dbC">-</span></div>
    </div>
  </div>

  <div class="container">
    <!-- Heatmap -->
    <div class="card grid-full">
      <h2>实时套利热力图</h2>
      <div class="fb">
        <select id="mnF"><option value="0">全部</option><option value="3">>3%</option><option value="5">>5%</option><option value="10">>10%</option></select>
        <select id="sF"><option value="net">净年化</option><option value="spread">Spread</option><option value="risk">风险</option></select>
      </div>
      <div class="heatmap" id="hm"></div>
    </div>

    <div class="grid grid-2">
      <!-- Opportunities -->
      <div class="card">
        <h2>套利机会</h2>
        <div style="max-height:350px;overflow-y:auto">
          <table><thead><tr><th>币</th><th>多</th><th>空</th><th>Spread</th><th>净年化</th><th>风险</th></tr></thead><tbody id="ot"></tbody></table>
        </div>
      </div>
      <!-- Cross-pair -->
      <div class="card">
        <h2>跨品种套利</h2>
        <div id="cp" style="max-height:350px;overflow-y:auto"><div class="empty">等待相关性信号</div></div>
      </div>
    </div>

    <div class="grid">
      <!-- Anomalies -->
      <div class="card">
        <h2>异常检测</h2>
        <div id="an" style="max-height:300px;overflow-y:auto"><div class="empty">等待数据</div></div>
      </div>
      <!-- Predictions -->
      <div class="card">
        <h2>费率预测</h2>
        <div id="pr" style="max-height:300px;overflow-y:auto"><div class="empty">积累数据中</div></div>
      </div>
      <!-- Paper Trading -->
      <div class="card">
        <h2>模拟交易 <span class="tag bd" id="ppTag">--</span></h2>
        <div id="pp"></div>
      </div>
      <!-- Backtest -->
      <div class="card">
        <h2>策略回测</h2>
        <div class="fb">
          <select id="btStrat"><option value="PURE_CARRY">Pure Carry</option><option value="MOMENTUM">Momentum</option><option value="MEAN_REVERSION">Mean Reversion</option><option value="COMPOUND">Compound</option></select>
          <input type="text" id="btSym" value="BTCUSDT" placeholder="Symbol" style="width:80px">
          <button id="btRun">Run</button>
        </div>
        <div id="btRes"></div>
      </div>
    </div>
  </div>

<script>
let ws, data;
const $ = id => document.getElementById(id);

function connect() {
  const p = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${p}//${location.host}/ws`);
  ws.onopen = () => { $('dot').classList.remove('off'); $('st').textContent = '实时'; };
  ws.onmessage = e => { data = JSON.parse(e.data).data; render(); };
  ws.onclose = () => { $('dot').classList.add('off'); $('st').textContent = '断开'; setTimeout(connect, 3000); };
  ws.onerror = () => ws.close();
}

function render() {
  if (!data) return;
  $('exC').textContent = data.stats.exchanges?.length || '-';
  $('rC').textContent = data.stats.totalRates || '-';
  $('oC').textContent = data.stats.oppCount || '-';
  $('aC').textContent = data.stats.anomalyCount || '-';
  $('cC').textContent = data.stats.crossPair || '-';
  $('dbC').textContent = data.stats.db?.rates ? (data.stats.db.rates / 1000).toFixed(1) + 'k' : '-';
  renderHM();
  renderOpps();
  renderAnom();
  renderPred();
  renderCP();
  renderPP();
}

function gc(v) { return v > 10 ? '#00d4aa' : v > 5 ? '#4a9eff' : v > 2 ? '#f5a623' : '#ff4444'; }

function renderHM() {
  let opps = data.opportunities || [];
  const mn = parseFloat($('mnF').value) || 0;
  const sf = $('sF').value;
  opps = opps.filter(o => o.netAnnualized >= mn);
  if (sf === 'net') opps.sort((a, b) => b.netAnnualized - a.netAnnualized);
  else if (sf === 'spread') opps.sort((a, b) => b.spreadPct - a.spreadPct);
  else opps.sort((a, b) => a.riskScore - b.riskScore);
  const top = opps.slice(0, 30);
  if (!top.length) { $('hm').innerHTML = '<div class="empty">暂无</div>'; return; }
  $('hm').innerHTML = top.map(o => {
    const c = gc(o.netAnnualized);
    return `<div class="hc" style="background:${c}18;border:1px solid ${c}33">
      <div class="s" style="color:${c}">${o.symbol.replace('USDT','')}</div>
      <div class="v" style="color:${c}">${o.netAnnualized}%</div>
      <div class="x">${o.spreadPct}%</div></div>`;
  }).join('');
}

function renderOpps() {
  const o = data.opportunities || [];
  $('ot').innerHTML = o.length ? o.slice(0, 15).map(x => `<tr>
    <td><b>${x.symbol}</b></td>
    <td><span class="bd bb">${x.longEx.slice(0,3)}</span></td>
    <td><span class="bd bb">${x.shortEx.slice(0,3)}</span></td>
    <td>${x.spreadPct}%</td>
    <td style="color:#00d4aa;font-weight:600">${x.netAnnualized}%</td>
    <td><span class="bd ${x.riskScore<30?'bg':x.riskScore<60?'by':'br'}">${x.riskScore}</span></td>
  </tr>`).join('') : '<tr><td colspan="6" class="empty">暂无</td></tr>';
}

function renderAnom() {
  const a = data.anomalies || [];
  $('an').innerHTML = a.length ? a.slice(0, 8).map(x => {
    const c = x.type.toLowerCase().slice(0, 2);
    const ic = x.type[0] === 'S' ? '🔺' : x.type[0] === 'C' ? '🔻' : x.type[0] === 'D' ? '⚡' : '🔄';
    return `<div class="em ${c}"><div class="d">${ic} ${x.description}</div>
      <div class="m">严重度 ${x.severity} | Z ${x.zScore?.toFixed(1) || '-'} | ${new Date(x.timestamp).toLocaleTimeString('zh-CN')}</div></div>`;
  }).join('') : '<div class="empty">无异常</div>';
}

function renderPred() {
  const p = data.predictions || [];
  $('pr').innerHTML = p.length ? p.slice(0, 8).map(x => {
    const ic = x.direction === 'INCREASING' ? '📈' : x.direction === 'DECREASING' ? '📉' : '➡️';
    const cl = x.direction === 'INCREASING' ? '#00d4aa' : x.direction === 'DECREASING' ? '#ff4444' : '#6b7a8d';
    return `<div class="pi"><span class="di">${ic}</span><div class="inf">
      <div class="sy">${x.symbol} <span style="color:#6b7a8d;font-weight:400">${x.exchange.slice(0,4)}</span></div>
      <div class="dt">${x.facts?.join(' | ') || ''}</div></div>
      <div class="cf" style="color:${cl}">${x.confidence}%</div></div>`;
  }).join('') : '<div class="empty">积累数据中</div>';
}

function renderCP() {
  const cp = data.crossPair || [];
  $('cp').innerHTML = cp.length ? cp.map(x => `
    <div class="em dv"><div class="d"><b>${x.pairA}/${x.pairB}</b> @ ${x.exchange}</div>
    <div class="m">${x.description}<br>相关性 ${x.correlation} | Z-score ${x.spreadZScore} | ${x.confidence}% 置信度</div></div>
  `).join('') : '<div class="empty">监控中 (积累价格序列)</div>';
}

function renderPP() {
  const ps = data.paperStats;
  if (!ps) { $('pp').innerHTML = '<div class="empty">等待</div>'; return; }
  const totalClass = ps.totalPnlPct >= 0 ? 'pnl-pos' : 'pnl-neg';
  $('ppTag').textContent = `${ps.openPositions} open / ${ps.closedPositions} closed`;
  $('pp').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px">
      <div style="background:#141c28;padding:8px;border-radius:6px">
        <div style="font-size:10px;color:#6b7a8d">总PnL</div>
        <div class="${totalClass}" style="font-size:16px;font-weight:700">${ps.totalPnlPct > 0 ? '+' : ''}${ps.totalPnlPct}%</div>
      </div>
      <div style="background:#141c28;padding:8px;border-radius:6px">
        <div style="font-size:10px;color:#6b7a8d">胜率</div>
        <div style="font-size:16px;font-weight:700">${ps.winRate}%</div>
      </div>
      <div style="background:#141c28;padding:8px;border-radius:6px">
        <div style="font-size:10px;color:#6b7a8d">Sharpe</div>
        <div style="font-size:14px;font-weight:700">${ps.sharpe}</div>
      </div>
      <div style="background:#141c28;padding:8px;border-radius:6px">
        <div style="font-size:10px;color:#6b7a8d">最大回撤</div>
        <div style="font-size:14px;font-weight:700;color:#ff4444">${ps.maxDrawdown}%</div>
      </div>
    </div>
    <div style="font-size:10px;color:#6b7a8d;margin-bottom:4px">总交易: ${ps.totalTrades}</div>
    <div style="max-height:120px;overflow-y:auto">
      ${ps.positions?.slice(0, 10).map(p => `<div style="padding:4px 0;border-bottom:1px solid #141c28;font-size:11px">
        <span style="font-weight:600">${p.symbol}</span>
        <span class="${p.pnlPct >= 0 ? 'pnl-pos' : 'pnl-neg'}" style="float:right">${p.pnlPct > 0 ? '+' : ''}${p.pnlPct.toFixed(2)}%</span>
        <span style="color:#6b7a8d;font-size:9px;margin-left:8px">${p.status}</span>
      </div>`).join('') || '<div class="empty">无持仓</div>'}
    </div>`;
}

// Backtest
$('btRun').onclick = async () => {
  $('btRes').innerHTML = '<div class="empty">运行中...</div>';
  try {
    const res = await fetch('/api/backtest', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        strategy: $('btStrat').value,
        symbol: $('btSym').value,
        initialCapital: 100000,
        feePerTrade: 0.04,
        slippage: 0.02,
      }),
    });
    const bt = await res.json();
    $('btRes').innerHTML = `<div class="bt-result">
      <div style="font-size:12px;font-weight:600;margin-bottom:8px">${bt.strategy} — ${bt.period}</div>
      <div class="metrics">
        <div class="metric"><div class="v ${bt.totalReturn >= 0 ? 'pnl-pos' : 'pnl-neg'}">${bt.totalReturn > 0 ? '+' : ''}${bt.totalReturn}%</div><div class="l">总收益</div></div>
        <div class="metric"><div class="v">${bt.sharpe}</div><div class="l">Sharpe</div></div>
        <div class="metric"><div class="v pnl-neg">${bt.maxDrawdown}%</div><div class="l">最大回撤</div></div>
        <div class="metric"><div class="v">${bt.winRate}%</div><div class="l">胜率</div></div>
        <div class="metric"><div class="v">${bt.tradeCount}</div><div class="l">交易次数</div></div>
        <div class="metric"><div class="v">${bt.profitFactor}</div><div class="l">盈亏比</div></div>
        <div class="metric"><div class="v">$${bt.finalCapital?.toLocaleString()}</div><div class="l">最终资金</div></div>
        <div class="metric"><div class="v">${bt.annualizedReturn > 0 ? '+' : ''}${bt.annualizedReturn}%</div><div class="l">年化</div></div>
      </div>
    </div>`;
  } catch (e) { $('btRes').innerHTML = `<div class="empty">Error: ${e.message}</div>`; }
};

$('mnF').onchange = renderHM;
$('sF').onchange = renderHM;
connect();
</script>
</body>
</html>
