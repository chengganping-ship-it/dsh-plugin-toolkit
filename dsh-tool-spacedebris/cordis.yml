name: spacedebris
version: 1.0.0
description: Space Debris & Orbital Management — collision risk assessment, orbital maneuver planning, debris tracking catalog maintenance, end-of-life disposal strategy, conjunction data message generation, debris removal mission design, space situational awareness dashboard, orbital slot allocation
author: chengganping-ship-it
tools:

  - name: collision_risk_assessor
    description: Collision Risk Assessment — conjunction screening, probability of collision (Pc) computation, miss distance analysis, covariance evaluation, and avoidance maneuver recommendation for LEO/GEO spacecraft
    inputSchema:
      type: object
      properties:
        spacecraft_id:
          type: string
          description: Primary spacecraft identifier (NORAD ID or mission name)
        altitude_km:
          type: number
          description: Orbit altitude in kilometers (e.g., 550 for Starlink)
        inclination_deg:
          type: number
          description: Orbit inclination in degrees (e.g., 53.0)
        eccentricity:
          type: number
          description: Orbit eccentricity (0.0 for circular)
        screening_volume_km:
          type: number          description: Conjunction screening half-width in km (default 25)
        pc_threshold:
          type: number          description: Probability of collision threshold (default 1e-4)
        time_window_hours:
          type: number          description: Screening time window in hours (default 168)
        available_delta_v_ms:
          type: number          description: Available delta-V for avoidance in m/s (default 5)
    outputSchema:
      type: object
      properties:
        risk_summary:
          type: string
          description: Overall collision risk summary
        max_pc:
          type: string          description: Maximum probability of collision found
        maneuver_required:
          type: string          description: Whether avoidance maneuver is recommended
        delta_v_requirement:
          type: string          description: Delta-V required for recommended maneuver
        time_to_tca:
          type: string          description: Time to closest approach for highest-risk event
        risk_level:
          type: string          description: Overall risk level classification
    examples:
      - input:
          spacecraft_id: "STARLINK-1245"
          altitude_km: 550
          inclination_deg: 53.0
          eccentricity: 0.0002
          screening_volume_km: 25
          pc_threshold: 0.0001
          time_window_hours: 168
          available_delta_v_ms: 5
        output:
          risk_summary: "3 conjunctions screened, 1 exceeds Pc threshold at 2.3e-4"
          max_pc: "2.3e-4"
          maneuver_required: "Yes"
          delta_v_requirement: "0.85 m/s"
          time_to_tca: "37.5 hours"
          risk_level: "MEDIUM"

  - name: orbital_maneuver_planner
    description: Orbital Maneuver Planning — computes Hohmann transfers, bi-elliptic transfers, plane changes, station-keeping burns, collision avoidance maneuvers, and deorbit trajectories with delta-V budget and propellant analysis
    inputSchema:
      type: object
      properties:
        maneuver_type:
          type: string
          description: Type of maneuver (hohmann, bi_elliptic, plane_change, station_keeping, collision_avoidance, deorbit)
        initial_altitude_km:
          type: number          description: Initial orbit altitude in km (e.g., 400)
        initial_inclination_deg:
          type: number          description: Initial inclination in degrees (e.g., 51.6)
        target_altitude_km:
          type: number          description: Target orbit altitude in km (e.g., 550)
        target_inclination_deg:
          type: number          description: Target inclination in degrees
        spacecraft_mass_kg:
          type: number          description: Spacecraft dry mass in kg (e.g., 1000)
        specific_impulse_s:
          type: number          description: Propellant specific impulse in seconds (e.g., 300)
        propellant_mass_kg:
          type: number          description: Available propellant mass in kg (e.g., 50)
    outputSchema:
      type: object
      properties:
        delta_v_total:
          type: string          description: Total delta-V budget for the maneuver
        transfer_time:
          type: string          description: Orbital transfer duration
        propellant_required:
          type: string          description: Propellant mass required
        propellant_margin:
          type: string          description: Propellant margin (available minus required)
        mass_ratio:
          type: string          description: Rocket equation mass ratio
        feasibility:
          type: string          description: Maneuver feasibility assessment
    examples:
      - input:
          maneuver_type: "hohmann"
          initial_altitude_km: 400
          initial_inclination_deg: 51.6
          target_altitude_km: 550
          target_inclination_deg: 51.6
          spacecraft_mass_kg: 1000
          specific_impulse_s: 300
          propellant_mass_kg: 50
        output:
          delta_v_total: "146.3 m/s"
          transfer_time: "47.2 min"
          propellant_required: "47.1 kg"
          propellant_margin: "2.9 kg"
          mass_ratio: "1.049"
          feasibility: "Feasible with tight margin"

  - name: debris_catalog_tracker
    description: Debris Catalog Maintenance & Tracking — maintains space object catalog, processes TLE updates, tracks close approaches, projects orbital decay, and monitors debris population evolution across LEO/MEO/GEO regimes
    inputSchema:
      type: object
      properties:
        region:
          type: string
          description: Orbital region (LEO, MEO, GEO, ALL)
        size_threshold_cm:
          type: number          description: Minimum debris size to track in cm (default 10)
        epoch:
          type: string          description: Epoch time for catalog snapshot (ISO 8601)
        projection_years:
          type: number          description: Years to project population evolution (default 20)
        include_decay_forecast:
          type: boolean          description: Include orbital decay projections
        include_close_approaches:
          type: boolean          description: Include close approach predictions
    outputSchema:
      type: object
      properties:
        catalog_summary:
          type: string          description: Summary of tracked objects by region
        population_growth_rate:
          type: string          description: Annual debris population growth rate
        decay_forecast:
          type: string          description: Projected reentry count over time window
        high_risk_objects:
          type: string          description: Objects posing elevated collision risk
        tracking_coverage:
          type: string          description: Percentage of catalog with current TLE data
        next_close_approach:
          type: string          description: Next predicted close approach event
    examples:
      - input:
          region: "LEO"
          size_threshold_cm: 10
          epoch: "2026-08-25T00:00:00Z"
          projection_years: 20
          include_decay_forecast: true
          include_close_approaches: true
        output:
          catalog_summary: "29,400 trackable objects in LEO (>10cm)"
          population_growth_rate: "3.5% per year"
          decay_forecast: "~850 natural reentries projected over 20 years"
          high_risk_objects: "12 objects with Pc > 1e-4"
          tracking_coverage: "97.2%"
          next_close_approach: "DEB-45211 / CZ-2D DEB — 0.3 km miss in 18h"

  - name: end_of_life_disposal
    description: End-of-Life Disposal Strategy — evaluates disposal options (natural decay, controlled reorbit, graveyard orbit, active deorbit) with delta-V requirements, timeline, casualty risk, and regulatory compliance for satellite end-of-life
    inputSchema:
      type: object
      properties:
        spacecraft_id:
          type: string          description: Spacecraft identifier
        current_altitude_km:
          type: number          description: Current orbit altitude in km
        spacecraft_mass_kg:
          type: number          description: Spacecraft mass in kg
        remaining_propellant_kg:
          type: number          description: Remaining propellant in kg
        disposal_option:
          type: string          description: Preferred disposal method (natural_decay, controlled_reorbit, graveyard, active_deorbit)
        compliance_standard:
          type: string          description: Regulatory standard (IADC, FCC_25yr, ESA_25yr)
    outputSchema:
      type: object
      properties:
        recommended_option:
          type: string          description: Recommended disposal strategy
        delta_v_required:
          type: string          description: Delta-V required for disposal
        disposal_timeline:
          type: string          description: Expected time to complete disposal
        casualty_risk:
          type: string          description: Predicted ground casualty probability
        compliance_status:
          type: string          description: Regulatory compliance assessment
        remaining_useful_life:
          type: string          description: Time until disposal must be executed
    examples:
      - input:
          spacecraft_id: "SENTINEL-1A"
          current_altitude_km: 693
          spacecraft_mass_kg: 2300
          remaining_propellant_kg: 45
          disposal_option: "controlled_reorbit"
          compliance_standard: "IADC"
        output:
          recommended_option: "Controlled reorbit to 200km decay altitude"
          delta_v_required: "98.5 m/s"
          disposal_timeline: "Controlled reentry within 6 hours of final burn"
          casualty_risk: "< 1e-4 (meets IADC threshold)"
          compliance_status: "Compliant with IADC 25-year rule"
          remaining_useful_life: "3.2 years until mandatory disposal"

  - name: conjunction_data_generator
    description: Conjunction Data Message (CDM) Generation — produces standardized CDM outputs per CCSDS 508.0-B-1 format with object identification, orbit state vectors at TCA, miss distance, collision probability, covariance matrices, and maneuver recommendations
    inputSchema:
      type: object
      properties:
        primary_object:
          type: string          description: Primary object (own spacecraft) designation
        secondary_object:
          type: string          description: Secondary object (debris/threat) designation
        tca:
          type: string          description: Time of Closest Approach (ISO 8601)
        miss_distance_km:
          type: number          description: Nominal miss distance in km
        collision_probability:
          type: number          description: Computed Pc value
        covariance_available:
          type: boolean          description: Whether covariance data is available
    outputSchema:
      type: object
      properties:
        cdm_id:
          type: string          description: Unique CDM message identifier
        cdm_version:
          type: string          description: CDM format version
        risk_classification:
          type: string          description: Risk level classification
        recommended_action:
          type: string          description: Recommended operator action
        covariance_quality:
          type: string          description: Covariance data quality assessment
        data_sources:
          type: string          description: Tracking data sources used
    examples:
      - input:
          primary_object: "STARLINK-1245"
          secondary_object: "DEB-45211"
          tca: "2026-08-26T14:23:45Z"
          miss_distance_km: 0.342
          collision_probability: 0.00023
          covariance_available: true
        output:
          cdm_id: "CDM-2026-0826-0042"
          cdm_version: "1.0"
          risk_classification: "MEDIUM — Monitor closely"
          recommended_action: "Prepare avoidance maneuver, standby for update"
          covariance_quality: "Good — 1-sigma < 50m RMS"
          data_sources: "Space-Track TLE, EISCAT radar, JSC Vimpel"

  - name: removal_mission_designer
    description: Active Debris Removal (ADR) Mission Design — designs removal mission architectures including target selection, rendezvous planning, capture mechanism selection, delta-V budgeting, cost estimation, and mission timeline for single and multi-target ADR missions
    inputSchema:
      type: object
      properties:
        target_objects:
          type: array
          description: List of target debris NORAD IDs
        removal_technology:
          type: string          description: Capture technology (net, harpoon, robotic_arm, tether, laser)
        servicer_mass_kg:
          type: number          description: servicer spacecraft mass in kg
        max_targets_per_mission:
          type: number          description: Maximum number of targets per servicer mission
        priority_metric:
          type: string          description: Target priority metric (collision_risk, mass, keessler_contribution)
    outputSchema:
      type: object
      properties:
        mission_architecture:
          type: string          description: Proposed mission architecture summary
        total_delta_v:
          type: string          description: Total delta-V for entire mission
        mission_duration:
          type: string          description: Total mission timeline
        cost_estimate:
          type: string          description: Estimated mission cost
        targets_served:
          type: string          description: Number of debris objects addressed
        keessler_impact:
          type: string          description: Impact on Kessler syndrome probability
    examples:
      - input:
          target_objects: [45211, 38901, 40214]
          removal_technology: "net"
          servicer_mass_kg: 1500
          max_targets_per_mission: 5
          priority_metric: "collision_risk"
        output:
          mission_architecture: "Multi-target sequential capture with net deployment"
          total_delta_v: "1,240 m/s"
          mission_duration: "18 months"
          cost_estimate: "USD 185M"
          targets_served: "3 priority objects"
          keessler_impact: "Reduces regional collision probability by 12%"

  - name: ssa_dashboard_builder
    description: Space Situational Awareness (SSA) Dashboard — generates comprehensive SSA situation displays including debris density heatmaps, conjunction timelines, collision risk trends, orbital slot utilization, and threat monitoring dashboards for space ops centers
    inputSchema:
      type: object
      properties:
        dashboard_type:
          type: string          description: Dashboard type (ops_center, executive, analyst, public)
        time_range_hours:
          type: number          description: Time range for display data in hours (default 24)
        region_filter:
          type: string          description: Orbital region filter (LEO, MEO, GEO, ALL)
        include_forecast:
          type: boolean          description: Include forecast projections
        asset_list:
          type: array
          description: List of own assets to monitor
    outputSchema:
      type: object
      properties:
        dashboard_summary:
          type: string          description: High-level situation summary
        active_conjunctions:
          type: string          description: Number of active conjunctions being monitored
        highest_risk_event:
          type: string          description: Highest-risk conjunction event details
        debris_density:
          type: string          description: Current debris density assessment
        forecast_alert:
          type: string          description: Forecast-based alert for coming events
        recommendations:
          type: string          description: Operational recommendations
    examples:
      - input:
          dashboard_type: "ops_center"
          time_range_hours: 24
          region_filter: "LEO"
          include_forecast: true
          asset_list: ["STARLINK-1245", "STARLINK-2089"]
        output:
          dashboard_summary: "Nominal — 2 conjunctions below threshold, 1 monitoring"
          active_conjunctions: "3"
          highest_risk_event: "STARLINK-1245 / DEB-45211 — Pc=2.3e-4, TCA +37h"
          debris_density: "Elevated in 550km shell — 0.0012 objects/km3"
          forecast_alert: "Fengyun-1C debris cluster transit window in 72h"
          recommendations: "Standby for update CDM-0042, plan avoidance for T-6h"

  - name: orbital_slot_allocator
    description: Orbital Slot Allocation — manages orbital slot assignment for constellation coordination, frequency/slot deconfliction, colocation safety analysis, slot spacing optimization, and regulatory compliance for ITU filing and collision avoidance
    inputSchema:
      type: object
      properties:
        constellation_name:
          type: string          description: Constellation name
        num_planes:
          type: number          description: Number of orbital planes
        satellites_per_plane:
          type: number          description: Satellites per orbital plane
        altitude_km:
          type: number          description: Orbit altitude in km
        inclination_deg:
          type: number          description: Orbit inclination in degrees
        spacing_method:
          type: string          description: Slot spacing method (uniform, phasing, adaptive)
        colocation_distance_km:
          type: number          description: Minimum colocation distance in km
    outputSchema:
      type: object
      properties:
        allocation_plan:
          type: string          description: Slot allocation plan summary
        total_satellites:
          type: string          description: Total satellites accommodated
        slot_spacing:
          type: string          description: Resulting slot spacing
        colocation_risk:
          type: string          description: Colocation safety assessment
        itu_compliance:
          type: string          description: ITU regulatory compliance status
        phasing_strategy:
          type: string          description: Walker delta phasing strategy details
    examples:
      - input:
          constellation_name: "Starlink Gen2"
          num_planes: 72
          satellites_per_plane: 22
          altitude_km: 550
          inclination_deg: 53.0
          spacing_method: "uniform"
          colocation_distance_km: 10
        output:
          allocation_plan: "Walker 72/22/1 delta configuration at 550km"
          total_satellites: "1,584"
          slot_spacing: "22.5 degrees (1,618 km along-track)"
          colocation_risk: "Minimum 12.3 km separation — SAFE"
          itu_compliance: "Compliant with ITU Appendix 30B"
          phasing_strategy: "Right ascension offset 5.0 deg between planes"
