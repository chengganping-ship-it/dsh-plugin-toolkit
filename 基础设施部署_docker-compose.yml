# 全自动化出海基础设施 · Docker Compose
# 一键部署：docker compose up -d
# 运行前提：1台VPS (2GB RAM, 2核, Ubuntu 22.04)
# 预估成本：$6-12/月

version: '3.8'

services:
  # ============================================
  # n8n: 自动化中枢（订单→交付→通知全链）
  # ============================================
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=n8n.yourdomain.com
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - N8N_EMAIL_MODE=smtp
      - N8N_SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - N8N_SMTP_PORT=${SMTP_PORT:-587}
      - N8N_SMTP_USER=${SMTP_USER}
      - N8N_SMTP_PASS=${SMTP_PASS}
      - WEBHOOK_URL=https://n8n.yourdomain.com/
      - GENERIC_TIMEZONE=Asia/Shanghai
      # 安全：密码加密
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-change-me-use-openssl-rand-hex-32}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-custom-nodes:/home/node/.n8n/custom
      - ./delivery-output:/home/node/delivery
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # Uptime Kuma: 服务端监控 + 状态页
  # ============================================
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "node", "extra/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # Listmonk: 邮件营销（替代Mailchimp）
  # ============================================
  listmonk:
    image: listmonk/listmonk:latest
    container_name: listmonk
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - LISTMONK_app__address=0.0.0.0:9000
      - LISTMONK_app__root_url=https://mail.yourdomain.com
      - LISTMONK_db__host=listmonk-postgresql
      - LISTMONK_db__port=5432
      - LISTMONK_db__user=listmonk
      - LISTMONK_db__password=${LISTMONK_DB_PASSWORD:-listmonk-pass}
      - LISTMONK_db__database=listmonk
      - LISTMONK_db__ssl_mode=disable
    command: [sh, -c, "yes | ./listmonk install --upgrade && ./listmonk serve --static-dir /listmonk/"]
    depends_on:
      listmonk-postgresql:
        condition: service_healthy
    networks:
      - app-network

  listmonk-postgresql:
    image: postgres:16-alpine
    container_name: listmonk-postgresql
    restart: unless-stopped
    environment:
      - POSTGRES_USER=listmonk
      - POSTGRES_PASSWORD=${LISTMONK_DB_PASSWORD:-listmonk-pass}
      - POSTGRES_DB=listmonk
    volumes:
      - listmonk_pg_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listmonk"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Umami: GDPR合规网站分析（替代GA4）
  # ============================================
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: umami
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - DATABASE_URL=postgresql://umami:${UMAMI_DB_PASSWORD:-umami-pass}@umami-postgresql:5432/umami
      - DATABASE_TYPE=postgresql
      - HASH_SALT=${UMAMI_SALT:-change-me-random-string}
      - APP_SECRET=${UMAMI_SALT:-change-me-random-string}
    depends_on:
      umami-postgresql:
        condition: service_healthy
    networks:
      - app-network

  umami-postgresql:
    image: postgres:16-alpine
    container_name: umami-postgresql
    restart: unless-stopped
    environment:
      - POSTGRES_USER=umami
      - POSTGRES_PASSWORD=${UMAMI_DB_PASSWORD:-umami-pass}
      - POSTGRES_DB=umami
    volumes:
      - umami_pg_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Nginx Proxy Manager: 反向代理 + SSL证书
  # ============================================
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"  # NPM Admin
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - app-network

volumes:
  n8n_data:
    driver: local
  uptime_kuma_data:
    driver: local
  listmonk_pg_data:
    driver: local
  umami_pg_data:
    driver: local
  npm_data:
    driver: local
  npm_letsencrypt:
    driver: local

networks:
  app-network:
    driver: bridge

# ============================================
# 部署后访问地址：
# - n8n:          https://n8n.yourdomain.com
# - Uptime Kuma:  https://uptime.yourdomain.com
# - Listmonk:     https://mail.yourdomain.com
# - Umami:        https://analytics.yourdomain.com
# - NPM Admin:    http://your-vps-ip:81 (admin@example.com / changeme)
# ============================================
